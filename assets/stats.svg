    <text x="70" y="25" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8b949e">Following</text>
    <text x="70" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">6</text>
