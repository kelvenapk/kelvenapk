<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  <rect width="495" height="195" rx="14" fill="url(#bg)" filter="url(#shadow)"/>
  <text x="25" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="bold" fill="#e6edf3">GitHub Stats</text>
  <text x="25" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#8b949e">kelvenapk + KT-TWEAKS org</text>

  <g transform="translate(25, 70)">
